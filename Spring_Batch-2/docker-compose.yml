# ============================================================
# Batch-2 練習環境：PostgreSQL + 做完就結束的批次
#
#   執行：docker compose run --rm app date=2026-10-12
#         （date=... 會成為 JobParameters；同一天再執行一次會被拒絕，exit code 不為 0）
#   觀察：docker compose exec postgres psql -U postgres -d Batch2 \
#           -c "select job_instance_id, job_name, job_key from batch_job_instance"
#   pgAdmin：docker compose --profile tools up -d pgadmin   （http://localhost:5050）
#   停止：docker compose down                     （加上 -v 會刪除資料庫）
# ============================================================
services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Batch2
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    # 刻意不對主機開放 5432，避免與本機的 PostgreSQL 衝突
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Batch2"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 沒有 ports：批次不提供網路服務，執行完容器就結束
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 對應 application.properties 的 ${DB_HOST:localhost}
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Taipei

  # 選用：只有加上 --profile tools 才會啟動
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
