spring.application.name=Spring_Kafka
server.port=8112

# Kafka \u7684\u4F4D\u5740\uFF1A\u4E3B\u6A5F\u4E0A\u7528 localhost:9092\uFF1BDocker Compose \u4E2D\u6539\u6210 kafka:19092\uFF08\u898B D:\dockercompose\kafka \u7684\u5169\u500B listener\uFF09
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---- Producer\uFF1Akey \u662F\u8A02\u55AE\u7DE8\u865F\uFF08\u5B57\u4E32\uFF09\uFF0Cvalue \u662F\u4E8B\u4EF6\uFF08JSON\uFF09 ----
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# \u6240\u6709\u526F\u672C\u90FD\u5BEB\u5165\u624D\u7B97\u6210\u529F\uFF08Kafka 3 \u8D77\u7684\u9810\u8A2D\uFF0C\u5BEB\u51FA\u4F86\u8B93\u610F\u601D\u660E\u78BA\uFF09
spring.kafka.producer.acks=all

# ---- Consumer ----
# \u65B0\u7684 consumer group \u7B2C\u4E00\u6B21\u555F\u52D5\u6642\uFF0C\u5F9E\u6700\u65E9\u7684\u8A0A\u606F\u958B\u59CB\u8B80\uFF08\u9810\u8A2D latest\uFF1A\u53EA\u8B80\u4E4B\u5F8C\u7684\u65B0\u8A0A\u606F\uFF09
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer \u5305\u4F4F JSON deserializer\uFF1AJSON \u58DE\u6389\u6642\u4E0D\u6703\u5361\u4F4F\uFF0C\u4EA4\u7D66\u932F\u8AA4\u8655\u7406\u9001\u9032 Dead Letter Topic\uFF08\u7B2C 5 \u8AB2\uFF09
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# \u53EA\u628A JSON \u8F49\u6210\u9019\u500B package \u88E1\u7684\u985E\u5225\uFF08\u4E0D\u4FE1\u4EFB\u8A0A\u606F\u88E1\u4EFB\u610F\u6307\u5B9A\u7684\u985E\u5225\uFF09
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.order

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 ProblemDetail
spring.mvc.problemdetails.enabled=true
