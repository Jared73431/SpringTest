# ============================================================
# Kafka 練習環境：Kafka 4.2（KRaft）+ 應用程式
#
#   啟動：docker compose up --build -d
#   下單：curl -X POST http://localhost:8112/api/orders -H "Content-Type: application/json" \
#              -d '{"customer":"alice","item":"book","quantity":2}'
#   出貨：curl http://localhost:8112/api/orders/{orderId}/shipment
#   UI：  docker compose --profile tools up -d kafka-ui   （http://localhost:9100）
#   停止：docker compose down                     （加上 -v 會刪除 Kafka 的資料）
#
# Kafka 的設定與 D:\dockercompose\kafka 相同；主機上執行應用程式時，連 localhost:9092
# ============================================================
services:

  kafka:
    image: apache/kafka:4.2.1   # Apache 官方 image；版本和 Spring Boot 4.1.1 使用的 kafka-clients 相同
    ports:
      - "9092:9092"
    environment:
      # ---- KRaft：Kafka 4 起不再需要 ZooKeeper，由 Kafka 自己的 controller 管理叢集資訊 ----
      # 單一節點同時擔任 broker（存放訊息）與 controller（管理叢集）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ---- 兩個 listener：最容易搞錯的地方 ----
      # 客戶端第一次連線後，Kafka 會回覆「之後請連到這個位址」（advertised listener）。
      # 容器內與主機上看到的位址不同，所以要兩個：
      #   PLAINTEXT      kafka:19092      給同一個 compose 裡的容器（kafka-ui、Docker 中的應用程式）
      #   PLAINTEXT_HOST localhost:9092   給主機上的程式（IDE 執行的應用程式、命令列工具）
      # 舊版全部用 host.docker.internal：只有 Docker Desktop 有，Linux 上不能用，容器之間也繞到主機
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ---- 只有一個節點：內部 topic 的副本數只能是 1（正式環境至少 3） ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # 容器之間用 kafka:19092（PLAINTEXT listener）
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - TZ=Asia/Taipei
    ports:
      # 主機的 port 可以用 APP_PORT 覆蓋（例如 Windows 保留了 8112 時：APP_PORT=8312 docker compose up）
      - "${APP_PORT:-8112}:8112"

  # 選用：只有加上 --profile tools 才會啟動
  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

volumes:
  kafka-data:
