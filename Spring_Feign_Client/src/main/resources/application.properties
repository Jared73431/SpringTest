server.port=8083

# Book Server \u7684\u4F4D\u5740\uFF0C\u5C0D\u61C9 @FeignClient(url = "${book-server.url}")
# \u672C\u6A5F\u9810\u8A2D localhost:8082\uFF1BDocker Compose \u4EE5\u74B0\u5883\u8B8A\u6578 BOOK_SERVER_URL \u6539\u6210\u670D\u52D9\u540D\u7A31 http://book-server:8082
book-server.url=${BOOK_SERVER_URL:http://localhost:8082}

# Feign \u8A2D\u5B9A\uFF1Aconfig \u5F8C\u9762\u7684 book-server \u5C0D\u61C9 @FeignClient(name = "book-server")\uFF0C\u53EA\u5957\u7528\u5728\u9019\u500B client
# \u9023\u7DDA\u903E\u6642 2 \u79D2\u3001\u8B80\u53D6\u903E\u6642 5 \u79D2\uFF08\u55AE\u4F4D\uFF1A\u6BEB\u79D2\uFF09\uFF0C\u907F\u514D Server \u6C92\u56DE\u61C9\u6642\u8ACB\u6C42\u4E00\u76F4\u5361\u4F4F
spring.cloud.openfeign.client.config.book-server.connect-timeout=2000
spring.cloud.openfeign.client.config.book-server.read-timeout=5000
# Feign \u8ACB\u6C42\u8A18\u9304\uFF1Anone / basic\uFF08\u65B9\u6CD5\u3001URL\u3001\u72C0\u614B\u78BC\u3001\u8017\u6642\uFF09/ headers / full
# Feign \u7684 log \u53EA\u6703\u4EE5 DEBUG \u7B49\u7D1A\u8F38\u51FA\uFF0C\u56E0\u6B64\u8981\u540C\u6642\u628A\u8A72\u4ECB\u9762\u7684 log \u7B49\u7D1A\u8A2D\u70BA DEBUG
spring.cloud.openfeign.client.config.book-server.logger-level=basic
logging.level.com.example.demo.client.BookClient=DEBUG

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true
