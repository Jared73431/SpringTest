spring.application.name=Spring_R2DBC2
server.port=8096

# R2DBC\uFF1A\u61C9\u7528\u7A0B\u5F0F\u5B58\u53D6\u8CC7\u6599\u5EAB\u7528
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/R2DBC2
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}

# Flyway\uFF1A\u53EA\u652F\u63F4 JDBC\uFF0C\u6240\u4EE5\u53E6\u5916\u63D0\u4F9B JDBC \u7684\u9023\u7DDA\u8CC7\u8A0A
# \u4FEE\u6B63\u524D\u53E6\u5916\u8A2D\u5B9A\u4E86 baseline-on-migrate=true + baseline-version=0\uFF1A\u8CC7\u6599\u5EAB\u5DF2\u6709 car \u8868\u6642\u6703\u4EE5 0 \u70BA\u57FA\u6E96\u518D\u57F7\u884C V1\uFF0C
# \u800C V1 \u7684 CREATE INDEX \u6C92\u6709 IF NOT EXISTS\uFF0C\u9077\u79FB\u6703\u5931\u6557\u3002\u9019\u662F\u7D66\u300C\u65E2\u6709\u8CC7\u6599\u5EAB\u7B2C\u4E00\u6B21\u5C0E\u5165 Flyway\u300D\u7528\u7684\u8A2D\u5B9A\uFF0C\u5E73\u5E38\u4E0D\u9700\u8981
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:5432/R2DBC2
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}

# \u9700\u8981\u67E5\u770B\u57F7\u884C\u7684 SQL \u6642\u518D\u6253\u958B\uFF08\u4FEE\u6B63\u524D\u9810\u8A2D\u5C31\u662F DEBUG\uFF0C\u6BCF\u500B\u8ACB\u6C42\u90FD\u6703\u5370\u51FA SQL\uFF09
#logging.level.io.r2dbc.postgresql.QUERY=DEBUG
