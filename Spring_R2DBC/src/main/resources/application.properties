spring.application.name=Spring_R2DBC
server.port=8095

# R2DBC\uFF1A\u61C9\u7528\u7A0B\u5F0F\u5B58\u53D6\u8CC7\u6599\u5EAB\u7528
# \u4FEE\u6B63\u524D\uFF1Ar2dbcs\uFF08\u555F\u7528 SSL\uFF09\u53C8\u52A0\u4E0A sslMode=disable\uFF0C\u5169\u8005\u4E92\u76F8\u77DB\u76FE
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/R2DBC
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}

# \u9023\u7DDA\u6C60\uFF08\u4FEE\u6B63\u524D\u5BEB\u6210 spring.pool.*\uFF0C\u524D\u7DB4\u932F\u8AA4\uFF0C\u8A2D\u5B9A\u5B8C\u5168\u6C92\u6709\u751F\u6548\uFF09
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-create-connection-time=2s

# Flyway\uFF1A\u53EA\u652F\u63F4 JDBC\uFF0C\u6240\u4EE5\u53E6\u5916\u63D0\u4F9B JDBC \u7684\u9023\u7DDA\u8CC7\u8A0A
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:5432/R2DBC
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}

# \u932F\u8AA4\u56DE\u61C9\u4F7F\u7528 RFC 9457 \u7684 ProblemDetail \u683C\u5F0F\uFF08application/problem+json\uFF09
spring.webflux.problemdetails.enabled=true
