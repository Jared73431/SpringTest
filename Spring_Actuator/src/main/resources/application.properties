spring.application.name=Spring_Actuator
server.port=8115

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Actuator
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# \u66F8\u7C4D\u5C01\u9762\u7684\u5B58\u653E\u76EE\u9304\uFF1ACoverStorageHealthIndicator \u6AA2\u67E5\u5B83\u662F\u5426\u5B58\u5728\u3001\u53EF\u4EE5\u5BEB\u5165
app.cover-storage.dir=${COVER_STORAGE_DIR:${java.io.tmpdir}}

spring.mvc.problemdetails.enabled=true

# ============================================================
# Actuator
# ============================================================

# ---- \u7B2C 5 \u8AB2\uFF1Amanagement \u653E\u5728\u53E6\u4E00\u500B port ----
# \u5C0D\u5916\u7684 API \u5728 8115\uFF0CActuator \u5728 9115\uFF1A\u9632\u706B\u7246 / Docker \u53EA\u5C0D\u5167\u958B\u653E 9115\uFF0C\u5916\u9762\u770B\u4E0D\u5230 /actuator
management.server.port=${MANAGEMENT_PORT:9115}

# ---- \u7B2C 1 \u8AB2\uFF1A\u900F\u904E HTTP \u516C\u958B\u54EA\u4E9B\u7AEF\u9EDE ----
# \u9810\u8A2D\u53EA\u516C\u958B health\u3002env\u3001configprops\u3001heapdump\u3001threaddump \u6703\u6D29\u6F0F\u8A2D\u5B9A\u6216\u8A18\u61B6\u9AD4\u5167\u5BB9\uFF0C\u4E0D\u516C\u958B
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers

# ---- \u7B2C 2 \u8AB2\uFF1AHealth ----
# \u986F\u793A\u6BCF\u500B\u6AA2\u67E5\u9805\u76EE\uFF08db\u3001diskSpace\u3001coverStorage\u2026\uFF09\u7684\u7D30\u7BC0\u3002\u53EA\u5C0D\u5167\u958B\u653E\u624D\u7528 always\uFF1B\u5426\u5247\u7528 when-authorized
management.endpoint.health.show-details=always
# liveness / readiness\uFF1AK8S \u7684\u5169\u7A2E\u63A2\u6E2C\uFF08\u4E0D\u5728 K8S \u4E0A\u6642\u4E5F\u53EF\u4EE5\u6253\u958B\uFF09
management.endpoint.health.probes.enabled=true
# readiness \u52A0\u4E0A\u8CC7\u6599\u5EAB\u8207\u5C01\u9762\u76EE\u9304\uFF1A\u5B83\u5011\u6709\u554F\u984C\u6642\u300C\u5148\u4E0D\u8981\u9001\u6D41\u91CF\u904E\u4F86\u300D
# liveness \u4E0D\u52A0\uFF1A\u8CC7\u6599\u5EAB\u65B7\u7DDA\u6642\u91CD\u65B0\u555F\u52D5\u61C9\u7528\u7A0B\u5F0F\u4E5F\u6C92\u7528
management.endpoint.health.group.readiness.include=readinessState,db,coverStorage

# ---- \u7B2C 3 \u8AB2\uFF1AInfo \u8207 Metrics ----
management.info.env.enabled=true
info.app.description=Spring Boot Actuator practice
management.info.java.enabled=true
management.info.os.enabled=true
# \u6BCF\u500B metric \u52A0\u4E0A application \u6A19\u7C64\uFF1APrometheus \u540C\u6642\u6293\u597D\u5E7E\u500B\u61C9\u7528\u7A0B\u5F0F\u6642\u7528\u4F86\u5340\u5206
management.metrics.tags.application=${spring.application.name}
# HTTP \u56DE\u61C9\u6642\u9593\u8F38\u51FA\u6210 histogram\uFF1AGrafana \u624D\u80FD\u7B97 p95
management.metrics.distribution.percentiles-histogram.http.server.requests=true
