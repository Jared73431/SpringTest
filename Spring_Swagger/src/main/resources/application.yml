# YAML 是 UTF-8，註解可以直接寫中文（修正前寫成 連線... 的跳脫字元，那是 .properties 才需要的寫法）
server:
  port: 8097

spring:
  application:
    # 修正前寫成「name:Spring_Swagger」：冒號後面沒有空格，YAML 會把整串當成一個字串，應用程式名稱根本沒有設定
    name: Spring_Swagger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/Swagger
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # 資料表由 Flyway 建立；Hibernate 只檢查 Entity 與資料表是否一致（修正前是 update：由 Hibernate 自動改資料表）
      ddl-auto: validate
    open-in-view: false

# springdoc：使用預設路徑 /v3/api-docs 與 /swagger-ui.html（修正前把 api-docs 改成 /api-docs）
springdoc:
  # 回應的 content type 預設寫成 application/json（否則文件上是 */*）
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: method
