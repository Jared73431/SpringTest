plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 明確引入：修正前沒有寫，Boot 3.2 + springdoc 2.2 時根本沒有驗證實作；升級到 springdoc 2.8 後才被間接帶入。
	// 程式直接用到的功能，不要依賴其他套件「剛好」帶進來
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Boot 4 必須使用 starter-flyway，只有 flyway-core 時遷移不會執行
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// springdoc 3.x 對應 Spring Boot 4：產生 /v3/api-docs 與 Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 只產生可執行的 bootJar，不另外產生 -plain.jar
tasks.named('jar') {
	enabled = false
}

// 匯出 OpenAPI 規格檔：./gradlew exportOpenApi → build/openapi/openapi.json、openapi.yaml
// （透過測試啟動應用程式與 Testcontainers 的 PostgreSQL，不需要另外準備資料庫）
tasks.register('exportOpenApi', Test) {
	description = 'Exports the OpenAPI spec to build/openapi'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching '*OpenApiContractTest.exportSpec'
	}
	outputs.upToDateWhen { false }
}
