spring.application.name=Spring_Flyway
server.port=8093

# ==============================================================
# \u8CC7\u6599\u5EAB
# Flyway \u9810\u8A2D\u4F7F\u7528\u9019\u500B DataSource \u57F7\u884C\u9077\u79FB\uFF0C\u4E0D\u9700\u8981\u53E6\u5916\u8A2D\u5B9A spring.flyway.url / user / password
# \uFF08\u4FEE\u6B63\u524D\u5169\u908A\u5404\u5BEB\u4E00\u4EFD\uFF0C\u4E4B\u5F8C\u5F88\u5BB9\u6613\u53EA\u6539\u5230\u5176\u4E2D\u4E00\u908A\uFF09
# ==============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Flyway
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================
# Flyway
# ==============================================================
# \u9077\u79FB\u6A94\u7684\u4F4D\u7F6E\uFF1ASQL \u653E\u5728 doc/migration/common\uFF0CJava \u9077\u79FB\u653E\u5728 db/migration\uFF08Java \u985E\u5225\u7684 package\uFF09
spring.flyway.locations=classpath:doc/migration/common,classpath:db/migration
# \u555F\u52D5\u6642\u5148\u9A57\u8B49\u5DF2\u57F7\u884C\u904E\u7684\u9077\u79FB\u6A94\u6C92\u6709\u88AB\u4FEE\u6539\uFF08checksum \u4E0D\u540C\u6642\u555F\u52D5\u5931\u6557\uFF09
spring.flyway.validate-on-migrate=true
# \u4EE5\u4E0B\u5169\u500B\u7DAD\u6301\u9810\u8A2D\u503C false\uFF0C\u4F7F\u7528\u6642\u6A5F\u8207\u9677\u9631\u898B readme\uFF1A
# out-of-order\uFF1A\u5141\u8A31\u7248\u672C\u865F\u8F03\u5C0F\u7684\u9077\u79FB\u665A\u65BC\u8F03\u5927\u7684\u7248\u672C\u57F7\u884C\uFF08\u591A\u4EBA\u4E26\u884C\u958B\u767C\u6642\u624D\u9700\u8981\uFF09
spring.flyway.out-of-order=false
# baseline-on-migrate\uFF1A\u8CC7\u6599\u5EAB\u5DF2\u6709\u8CC7\u6599\u8868\u4F46\u6C92\u6709 flyway_schema_history \u6642\uFF0C\u5148\u5EFA\u7ACB\u57FA\u6E96\u7DDA\u518D\u9077\u79FB\uFF08\u5C0E\u5165\u65E2\u6709\u8CC7\u6599\u5EAB\u6642\u624D\u9700\u8981\uFF09
spring.flyway.baseline-on-migrate=false

# ==============================================================
# Actuator\uFF1A/actuator/flyway \u67E5\u770B\u6BCF\u500B\u9077\u79FB\u7684\u7248\u672C\u3001\u72C0\u614B\u3001checksum\u3001\u57F7\u884C\u6642\u9593
# ==============================================================
management.endpoints.web.exposure.include=health,flyway
