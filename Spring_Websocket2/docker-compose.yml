# ============================================================
# Websocket2 練習環境：PostgreSQL + STOMP 聊天室
#
#   啟動：docker compose up --build -d
#   頁面：http://localhost:8109 （開兩個分頁、用不同名稱加入同一個聊天室）
#   紀錄：curl http://localhost:8109/api/rooms/java/messages
#   資料庫：docker compose exec postgres psql -U postgres -d Websocket2 -c "select * from chat_message"
#   pgAdmin：docker compose --profile tools up -d pgadmin   （http://localhost:5050）
#   停止：docker compose down                     （加上 -v 會刪除資料庫）
# ============================================================
services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Websocket2
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    # 刻意不對主機開放 5432，避免與本機的 PostgreSQL 衝突
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Websocket2"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 對應 application.properties 的 ${DB_HOST:localhost}
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Taipei
    ports:
      # 主機的 port 可以用 APP_PORT 覆蓋（例如 Windows 保留了 8109 時：APP_PORT=8309 docker compose up）
      - "${APP_PORT:-8109}:8109"

  # 選用：只有加上 --profile tools 才會啟動
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
