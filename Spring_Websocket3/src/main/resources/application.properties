spring.application.name=Spring_Websocket3
server.port=8110

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Websocket3
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# \u6A94\u6848\u5B58\u653E\u7684\u76EE\u9304\uFF08\u4FEE\u6B63\u524D\u5BEB\u6B7B\u6210 D:/uploads\uFF0C\u5728 Linux / Docker \u4E0D\u80FD\u7528\uFF09
app.storage.directory=${STORAGE_DIRECTORY:uploads}

# \u55AE\u4E00\u6A94\u6848\u6700\u5927 5MB\uFF1B\u8D85\u904E\u6642\u56DE\u61C9 413\uFF08FileExceptionHandler\uFF09
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# \u932F\u8AA4\u56DE\u61C9\u4F7F\u7528 ProblemDetail
spring.mvc.problemdetails.enabled=true
# Tomcat \u62D2\u7D55\u8ACB\u6C42\u6642\uFF0C\u6700\u591A\u8B80\u6389 2MB\uFF08\u9810\u8A2D\uFF09\u9084\u6C92\u9001\u5B8C\u7684\u5167\u5BB9\uFF0C\u8D85\u904E\u5C31\u76F4\u63A5\u95DC\u9589\u9023\u7DDA\uFF0C\u5BA2\u6236\u7AEF\u6536\u4E0D\u5230 413\u3002
# \u8ABF\u5230\u6BD4\u4E0A\u50B3\u9650\u5236\u5927\uFF0C\u88AB\u62D2\u7D55\u7684\u4E0A\u50B3\u624D\u80FD\u6536\u5230 413 \u7684\u56DE\u61C9
server.tomcat.max-swallow-size=10MB
