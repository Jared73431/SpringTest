# ============================================================
# Kafka2 整套系統：Kafka + Order 服務 + Shipping 服務，每個服務有自己的資料庫
#
#   Order 服務 ──order-events──→ Kafka ──→ Shipping 服務
#      ↑                                       │
#      └──────── shipment-events ←─────────────┘
#
#   啟動：docker compose up --build -d
#   下單：curl -X POST http://localhost:8113/api/orders -H "Content-Type: application/json" \
#              -d '{"customer":"alice","item":"book","quantity":2}'
#   訂單：curl http://localhost:8113/api/orders/{orderId}       （PENDING → 一兩秒後 SHIPPED）
#   出貨：curl http://localhost:8114/api/shipments/{orderId}
#   UI：  docker compose --profile tools up -d kafka-ui   （http://localhost:9100）
#   停止：docker compose down                     （加上 -v 會刪除 Kafka 與資料庫的資料）
#
# Kafka 的設定與 D:\dockercompose\kafka、Spring_Kafka 相同（說明見 Spring_Kafka 的 docker-compose.yml）
# ============================================================
services:

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:19092 給容器、localhost:9092 給主機上的程式
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---- 每個服務有自己的資料庫：另一個服務不能直接查，只能透過事件或 API ----
  # 刻意不對主機開放 5432，避免與本機的 PostgreSQL 衝突
  order-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Kafka2Order
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Kafka2Order"]
      interval: 5s
      timeout: 3s
      retries: 10

  shipping-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Kafka2Shipping
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - shipping-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Kafka2Shipping"]
      interval: 5s
      timeout: 3s
      retries: 10

  order:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      order-db:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - DB_HOST=order-db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Taipei
    ports:
      # 主機的 port 可以用 ORDER_PORT 覆蓋（例如 Windows 保留了 8113 時：ORDER_PORT=8313 docker compose up）
      - "${ORDER_PORT:-8113}:8113"

  shipping:
    build: ../Spring_Kafka2_Shipping
    depends_on:
      kafka:
        condition: service_healthy
      shipping-db:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - DB_HOST=shipping-db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Taipei
    ports:
      - "${SHIPPING_PORT:-8114}:8114"

  # 選用：只有加上 --profile tools 才會啟動
  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

volumes:
  kafka-data:
  order-db-data:
  shipping-db-data:
