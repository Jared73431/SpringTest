spring.application.name=Spring_Kafka2_Order
server.port=8113

# \u6BCF\u500B\u670D\u52D9\u6709\u81EA\u5DF1\u7684\u8CC7\u6599\u5EAB\uFF08Database per Service\uFF09
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Kafka2Order
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Kafka \u7684\u4F4D\u5740\uFF1A\u4E3B\u6A5F\u4E0A\u7528 localhost:9092\uFF1BDocker Compose \u4E2D\u6539\u6210 kafka:19092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---- Producer\uFF1Akey \u662F\u8A02\u55AE\u7DE8\u865F\uFF0Cvalue \u662F\u4E8B\u4EF6\uFF08JSON\uFF09 ----
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
# \u4E0D\u5728\u6A19\u982D\u5BEB\u5165 Java \u985E\u5225\u540D\u7A31\uFF08__TypeId__\uFF09\uFF1A\u5169\u500B\u670D\u52D9\u7684\u985E\u5225\u540D\u7A31\u4E0D\u540C\uFF0C\u7D04\u5B9A\u53EA\u6709 JSON \u7684\u6B04\u4F4D
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ---- Consumer ----
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# \u4E0D\u770B\u6A19\u982D\uFF0C\u4E00\u5F8B\u628A JSON \u8F49\u6210\u81EA\u5DF1\u7684 ShipmentEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.event.ShipmentEvent

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 ProblemDetail
spring.mvc.problemdetails.enabled=true
