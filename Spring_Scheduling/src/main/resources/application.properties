spring.application.name=Spring_Scheduling
server.port=8099

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Scheduling
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# \u6392\u7A0B\u7684\u57F7\u884C\u7DD2\u6C60\uFF1A\u9810\u8A2D\u53EA\u6709 1 \u689D\uFF0C\u6240\u6709 @Scheduled \u5171\u7528\uFF0C\u4E00\u500B\u6162\u4EFB\u52D9\u6703\u62D6\u4F4F\u5176\u4ED6\u6392\u7A0B\uFF08\u7B2C 3 \u8AB2\uFF09
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=scheduling-

# \u6BCF\u5929\u51CC\u6668 3 \u9EDE\u6E05\u9664\u904E\u671F\u7684 session\uFF08\u53F0\u5317\u6642\u9593\uFF09\u3002cron \u8A2D\u6210 - \u53EF\u4EE5\u505C\u7528\u9019\u500B\u6392\u7A0B
app.cleanup.cron=0 0 3 * * *
app.cleanup.zone=Asia/Taipei

# /actuator/scheduledtasks \u5217\u51FA\u6240\u6709\u6392\u7A0B
management.endpoints.web.exposure.include=health,scheduledtasks
