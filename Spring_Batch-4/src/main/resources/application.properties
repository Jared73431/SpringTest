spring.application.name=Spring_Batch-4
server.port=8104

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Batch4
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# \u8868\u5168\u90E8\u7531 Flyway \u5EFA\u7ACB\uFF08db/migration\uFF09\uFF0CSpring Batch \u4E0D\u81EA\u5DF1\u5EFA\u8868
spring.batch.jdbc.initialize-schema=never
# \u6709\u591A\u500B Job\uFF1A\u555F\u52D5\u6642\u4E0D\u81EA\u52D5\u57F7\u884C\uFF0C\u6539\u7531 REST API \u6307\u5B9A\u8981\u57F7\u884C\u54EA\u4E00\u500B\uFF08\u7B2C 3 \u8AB2\uFF09
spring.batch.job.enabled=false

# \u932F\u8AA4\u56DE\u61C9\u4F7F\u7528 ProblemDetail
spring.mvc.problemdetails.enabled=true

# \u66F8\u7C4D\u5831\u8868\u7684\u8F38\u51FA\u76EE\u9304
app.report.directory=${REPORT_DIRECTORY:output}
