plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Boot 4：starter-batch 不含 JDBC，JobRepository 存進資料庫需要 starter-batch-jdbc
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
	// REST API 啟動 Job、查詢執行狀態
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// BATCH_* 表與 book、book_order 表由 Flyway 建立；Boot 4 必須使用 starter-flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.awaitility:awaitility'
	// 只有第 1 課比較 JpaPagingItemReader、RepositoryItemReader 時使用；主程式全部使用 JDBC
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 只產生可執行的 bootJar，不另外產生 -plain.jar
tasks.named('jar') {
	enabled = false
}
