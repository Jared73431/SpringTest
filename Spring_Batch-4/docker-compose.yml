# ============================================================
# Batch-4 練習環境：PostgreSQL + 書店批次（REST API 啟動 Job）
#
#   啟動：docker compose up --build -d
#   Job：curl http://localhost:8104/api/jobs
#   執行：curl -X POST http://localhost:8104/api/jobs/orderShippingJob/executions
#         curl -X POST http://localhost:8104/api/jobs/priceUpdateJob/executions \
#              -H "Content-Type: application/json" \
#              -d '{"input.file":"classpath:price-updates/price-update-2026-10-12.csv"}'
#   狀態：curl http://localhost:8104/api/jobs/executions/1     （POST 回應的 Location）
#   報表：docker compose exec app ls /app/output
#   pgAdmin：docker compose --profile tools up -d pgadmin   （http://localhost:5050）
#   停止：docker compose down                     （加上 -v 會刪除資料庫與報表）
# ============================================================
services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Batch4
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    # 刻意不對主機開放 5432，避免與本機的 PostgreSQL 衝突
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Batch4"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 對應 application.properties 的 ${DB_HOST:localhost}
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Taipei
    ports:
      # 主機的 port 可以用 APP_PORT 覆蓋（例如 Windows 保留了 8104 時：APP_PORT=8304 docker compose up）
      - "${APP_PORT:-8104}:8104"
    volumes:
      - reports:/app/output

  # 選用：只有加上 --profile tools 才會啟動
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
  reports:
