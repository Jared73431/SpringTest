spring.application.name=Spring_Quartz
server.port=8100

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/Quartz
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Quartz\uFF1A\u6392\u7A0B\uFF08Job\u3001Trigger\uFF09\u5B58\u5728\u8CC7\u6599\u5EAB\uFF0C\u91CD\u65B0\u555F\u52D5\u5F8C\u4ECD\u7136\u5B58\u5728\uFF1B\u4F7F\u7528 Spring \u7684 DataSource
# \u4FEE\u6B63\u524D\u81EA\u5DF1\u5EFA\u7ACB SchedulerFactoryBean\u3001\u8B80\u53D6\u539F\u59CB\u7684 properties \u6A94\u3001\u53E6\u5916\u7528 c3p0 \u5EFA\u7ACB\u9023\u7DDA\u6C60\uFF0CSpring Boot \u7684\u81EA\u52D5\u8A2D\u5B9A\u5168\u90E8\u88AB\u7E5E\u904E
spring.quartz.job-store-type=jdbc
# qrtz_* \u8CC7\u6599\u8868\u7531 Flyway \u5EFA\u7ACB\uFF08V1__quartz_tables.sql\uFF09
spring.quartz.jdbc.initialize-schema=never
# \u7A0B\u5F0F\u4E2D\u5B9A\u7FA9\u7684 Job\uFF08DailySummaryJob\uFF09\u555F\u52D5\u6642\u8986\u84CB\u8CC7\u6599\u5EAB\u4E2D\u7684\u820A\u8A2D\u5B9A
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.scheduler.instanceName=quartz-demo
# \u6BCF\u500B\u5BE6\u4F8B\u81EA\u52D5\u7522\u751F\u552F\u4E00\u7684 ID\uFF08\u53E2\u96C6\u4E2D\u7528\u4F86\u5340\u5206\u662F\u54EA\u4E00\u53F0\uFF09
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
# \u53E2\u96C6\uFF1A\u591A\u500B\u5BE6\u4F8B\u5171\u7528\u540C\u4E00\u500B\u8CC7\u6599\u5EAB\uFF0C\u540C\u4E00\u6B21\u89F8\u767C\u53EA\u6709\u4E00\u53F0\u57F7\u884C\uFF1B\u67D0\u4E00\u53F0\u505C\u6B62\u6642\uFF0C\u5176\u4ED6\u53F0\u63A5\u624B\u5B83\u7684\u6392\u7A0B\uFF08\u7B2C 6 \u8AB2\uFF09
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=5000
# \u932F\u904E\u89F8\u767C\u6642\u9593\u8D85\u904E 60 \u79D2\u624D\u7B97 misfire\uFF08\u4FEE\u6B63\u524D\u8A2D\u6210 1 \u79D2\uFF0C\u592A\u5BB9\u6613\u8AA4\u5224\uFF09\uFF08\u7B2C 4 \u8AB2\uFF09
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# \u932F\u8AA4\u56DE\u61C9\u4F7F\u7528 ProblemDetail
spring.mvc.problemdetails.enabled=true

# /actuator/quartz \u5217\u51FA\u6240\u6709 Job \u8207 Trigger
management.endpoints.web.exposure.include=health,quartz
