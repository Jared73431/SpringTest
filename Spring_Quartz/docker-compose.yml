# ============================================================
# Quartz 練習環境：PostgreSQL + 兩個應用程式實例（Quartz 叢集）
#
#   啟動：docker compose up --build
#   新增一個每 5 秒觸發的提醒：
#     curl -H 'Content-Type: application/json' -d '{"name":"demo","cron":"0/5 * * * * ?","recipient":"store-101","message":"打烊後盤點"}' localhost:8100/api/reminders
#   觀察：docker compose logs -f app app-b
#         兩個實例共用同一個資料庫，每次觸發只有其中一台印出「Send to store-101」；
#         停掉一台（docker compose stop app-b）後，另一台會接手
#   排程：curl localhost:8100/actuator/quartz/jobs
#   停止：docker compose down                     （加上 -v 會刪除資料庫）
# ============================================================
x-app: &app
  build: .
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    # 對應 application.properties 的 ${DB_HOST:localhost}
    - DB_HOST=postgres
    - DB_USERNAME=${DB_USERNAME:-postgres}
    - DB_PASSWORD=${DB_PASSWORD:-postgres}
    - TZ=Asia/Taipei

services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Quartz
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    # 刻意不對主機開放 5432，避免與本機的 PostgreSQL 衝突
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Quartz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    <<: *app
    ports:
      # 主機的 port 可以用 APP_PORT 覆蓋（例如 Windows 保留了 8100 時：APP_PORT=8300 docker compose up）
      - "${APP_PORT:-8100}:8100"

  # 第二個實例：模擬部署兩台主機（不對外開放 port，只用來觀察 log）
  app-b:
    <<: *app

volumes:
  postgres-data:
