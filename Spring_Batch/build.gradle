plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Boot 4：starter-batch 不再包含 JDBC，需改用 starter-batch-jdbc（JobRepository 存進資料庫、建立 TransactionManager）
	// 實測：只用 starter-batch 時容器裡沒有任何 PlatformTransactionManager，Step 無法建立，應用程式無法啟動
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
	// JobRepository 需要資料庫：H2 記憶體資料庫，Spring Batch 啟動時自動建立 BATCH_* 表
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 只產生可執行的 bootJar，不另外產生 -plain.jar
tasks.named('jar') {
	enabled = false
}
