spring.application.name=Spring_Okhttp
server.port=8088

# \u5916\u90E8 API \u7684\u4F4D\u5740\u3001OkHttpClient \u7684\u903E\u6642\u8207\u65E5\u8A8C\u7B49\u7D1A\uFF08\u5C0D\u61C9 JsonPlaceholderProperties\uFF09
jsonplaceholder.base-url=https://jsonplaceholder.typicode.com
jsonplaceholder.connect-timeout=2s
jsonplaceholder.read-timeout=5s
jsonplaceholder.write-timeout=5s
# NONE / BASIC\uFF08\u65B9\u6CD5\u3001URL\u3001\u72C0\u614B\u78BC\u3001\u8017\u6642\uFF09/ HEADERS / BODY\uFF08\u542B\u5B8C\u6574\u5167\u5BB9\uFF0C\u6B63\u5F0F\u74B0\u5883\u4E0D\u5EFA\u8B70\uFF09
jsonplaceholder.log-level=BASIC

# \u555F\u52D5\u5F8C\u81EA\u52D5\u793A\u7BC4\u4E00\u6B21\uFF08\u8A2D\u70BA false \u95DC\u9589\uFF09
demo.runner.enabled=true

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true
