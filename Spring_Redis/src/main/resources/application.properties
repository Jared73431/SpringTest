spring.application.name=Spring_Redis
server.port=8089

# Redis \u9023\u7DDA\uFF08\u672C\u6A5F\u9810\u8A2D localhost:6379\uFF1BDocker Compose \u4EE5\u74B0\u5883\u8B8A\u6578 REDIS_HOST \u6539\u6210\u670D\u52D9\u540D\u7A31\uFF09
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2s
# \u6C92\u6709\u5BC6\u78BC\u6642\u4E0D\u5FC5\u8A2D\u5B9A\uFF1B\u6709\u8A2D\u5B9A\u6642\u4EE5\u74B0\u5883\u8B8A\u6578\u63D0\u4F9B\uFF0C\u4E0D\u5BEB\u5728\u8A2D\u5B9A\u6A94\u4E2D
spring.data.redis.password=${REDIS_PASSWORD:}

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true

# \u9650\u6D41\u60C5\u5883\uFF1A\u6BCF\u500B\u547C\u53EB\u7AEF\u5728\u6642\u9593\u7A97\u5167\u7684\u6B21\u6578\u4E0A\u9650
demo.rate-limit.max-requests=5
demo.rate-limit.window=60s
