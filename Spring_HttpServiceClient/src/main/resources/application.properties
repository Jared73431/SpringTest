spring.application.name=Spring_HttpServiceClient
server.port=8111

# HTTP Service Client \u7684\u8A2D\u5B9A\uFF1Aserviceclient \u5F8C\u9762\u7684 book-server \u662F\u7FA4\u7D44\u540D\u7A31\uFF0C\u5C0D\u61C9 @ImportHttpServices(group = "book-server")
# Book Server \u7684\u4F4D\u5740\uFF1A\u672C\u6A5F\u9810\u8A2D localhost:8082\uFF1BDocker Compose \u4EE5\u74B0\u5883\u8B8A\u6578 BOOK_SERVER_URL \u6539\u6210\u670D\u52D9\u540D\u7A31
spring.http.serviceclient.book-server.base-url=${BOOK_SERVER_URL:http://localhost:8082}
# \u9023\u7DDA\u903E\u6642 2 \u79D2\u3001\u8B80\u53D6\u903E\u6642 5 \u79D2\uFF0C\u907F\u514D Server \u6C92\u6709\u56DE\u61C9\u6642\u8ACB\u6C42\u4E00\u76F4\u5361\u4F4F
spring.http.serviceclient.book-server.connect-timeout=2s
spring.http.serviceclient.book-server.read-timeout=5s
# \u6BCF\u500B\u8ACB\u6C42\u90FD\u5E36\u4E0A\u7684\u6A19\u982D\uFF08\u4F8B\u5982\u8B93 Server \u77E5\u9053\u662F\u8AB0\u5728\u547C\u53EB\uFF09
spring.http.serviceclient.book-server.default-header.X-Client-Name=spring-http-service-client

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true
