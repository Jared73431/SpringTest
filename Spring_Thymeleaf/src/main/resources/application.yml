server:
  port: 8098
  servlet:
    session:
      # flash 訊息存在 session 中。不限制時，第一次請求 Tomcat 不知道瀏覽器是否支援 cookie，會把 session id
      # 寫進網址（/messages;jsessionid=...），可能經由瀏覽器歷史、log、Referer 外洩。只用 cookie 追蹤 session
      tracking-modes: cookie

spring:
  application:
    name: Spring_Thymeleaf

# 修正前在最外層寫了 thymeleaf:（cache、prefix、suffix、encoding、mode），不是 spring.thymeleaf.*，完全沒有作用。
# 那些值剛好都是預設值（templates/ 底下的 .html、UTF-8、HTML 模式），開發時 devtools 也會自動關閉快取，所以全部刪除。
# 需要修改時要寫在 spring.thymeleaf 底下，例如：
#spring:
#  thymeleaf:
#    cache: false
