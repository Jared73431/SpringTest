spring.application.name=Spring_Caffeine
server.port=8091

# \u8CC7\u6599\u5EAB\uFF1A\u8207 Spring_Cache \u5171\u7528\u540C\u4E00\u500B\u8CC7\u6599\u5EAB test2 \u7684 users \u8CC7\u6599\u8868\uFF08\u540C\u4E00\u4EFD\u8CC7\u6599\uFF0C\u63DB\u4E00\u7A2E\u5FEB\u53D6\uFF09
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/test2
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
# \u986F\u793A SQL\uFF1A\u5FEB\u53D6\u547D\u4E2D\u6642\u4E0D\u6703\u51FA\u73FE\u67E5\u8A62 SQL\uFF0C\u53EF\u4EE5\u7528\u4F86\u89C0\u5BDF\u5FEB\u53D6\u662F\u5426\u751F\u6548
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# \u5404\u5FEB\u53D6\u7684\u5BB9\u91CF\u4E0A\u9650\u8207\u5B58\u6D3B\u6642\u9593\uFF08\u5C0D\u61C9 CacheProperties\uFF09
app.cache.users.maximum-size=1000
app.cache.users.expire-after-write=10m
app.cache.users-by-email.maximum-size=1000
app.cache.users-by-email.expire-after-write=10m
app.cache.all-users-maximum-size=1
app.cache.all-users-expire-after-write=1m

# Actuator\uFF1A\u958B\u653E\u5FEB\u53D6\u6E05\u55AE\uFF08/actuator/caches\uFF09\u8207\u6307\u6A19\uFF08/actuator/metrics/cache.gets \u7B49\uFF09
management.endpoints.web.exposure.include=health,caches,metrics

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true
