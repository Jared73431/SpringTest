spring.application.name=Spring_HttpClient
server.port=8087

# \u5916\u90E8 API \u7684\u4F4D\u5740\u8207\u903E\u6642\uFF08\u5C0D\u61C9 JsonPlaceholderProperties\uFF09\uFF0C\u6E2C\u8A66\u6642\u6539\u6210 WireMock \u7684\u4F4D\u5740
jsonplaceholder.base-url=https://jsonplaceholder.typicode.com
jsonplaceholder.connect-timeout=2s
jsonplaceholder.read-timeout=5s

# \u555F\u52D5\u5F8C\u81EA\u52D5\u793A\u7BC4\u4E00\u6B21 GET / POST / PUT / DELETE\uFF08\u8A2D\u70BA false \u95DC\u9589\uFF09
demo.runner.enabled=true

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true
