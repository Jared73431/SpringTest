# ============================================================
# JPA2 練習環境：PostgreSQL + 應用程式
#
#   啟動：docker compose up --build -d
#   呼叫：curl http://localhost:8015/api/products
#   圖片上傳頁：http://localhost:8015/
#   pgAdmin：docker compose --profile tools up -d pgadmin   （http://localhost:5050）
#   停止：docker compose down                     （加上 -v 會刪除資料庫）
# ============================================================
services:

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    # 刻意不對主機開放 5432，避免與本機的 PostgreSQL 衝突
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d test"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # application.properties 的資料庫網址是 localhost，在容器中改成服務名稱 postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/test
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=Asia/Taipei
    ports:
      # 主機的 port 可以用 APP_PORT 覆蓋（例如 APP_PORT=8315 docker compose up）
      - "${APP_PORT:-8015}:8015"

  # 選用：只有加上 --profile tools 才會啟動
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
