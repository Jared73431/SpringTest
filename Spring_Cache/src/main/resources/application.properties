spring.application.name=Spring_Cache
server.port=8090

# \u8CC7\u6599\u5EAB\uFF08\u8CC7\u6599\u8868 users \u7531 Hibernate \u81EA\u52D5\u5EFA\u7ACB\uFF09
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/test2
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
# \u986F\u793A SQL\uFF1A\u5FEB\u53D6\u547D\u4E2D\u6642\u4E0D\u6703\u51FA\u73FE\u67E5\u8A62 SQL\uFF0C\u53EF\u4EE5\u7528\u4F86\u89C0\u5BDF\u5FEB\u53D6\u662F\u5426\u751F\u6548
spring.jpa.show-sql=true
# \u95DC\u9589 Open Session in View\uFF1A\u8CC7\u6599\u5EAB\u9023\u7DDA\u5728 Service \u7D50\u675F\u6642\u5C31\u91CB\u653E\uFF08\u4E5F\u6D88\u9664\u555F\u52D5\u6642\u7684\u8B66\u544A\uFF09
spring.jpa.open-in-view=false

# Redis\uFF08\u5FEB\u53D6\u5B58\u653E\u4F4D\u7F6E\uFF09
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# \u5FEB\u53D6\u7684 TTL\u3001key \u524D\u7DB4\u3001\u5E8F\u5217\u5316\u90FD\u5B9A\u7FA9\u5728 RedisConfig\uFF08\u81EA\u8A02 CacheManager \u6642\uFF0Cspring.cache.redis.* \u4E0D\u6703\u751F\u6548\uFF09

# \u6240\u6709\u932F\u8AA4\u56DE\u61C9\u7D71\u4E00\u4F7F\u7528 RFC 9457 ProblemDetail \u683C\u5F0F
spring.mvc.problemdetails.enabled=true
